name: Collect repository traffic

on:
  workflow_dispatch:
  schedule:
    - cron: "23 4 * * *"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/collect.yml"
      - "src/**"
      - "repositories.json"
      - "preview_badges.json"
      - "package.json"
      - "README.md"

permissions:
  contents: write

concurrency:
  group: repo-metrics-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Install badge icon dependencies
        run: npm install --no-audit --no-fund

      - name: Resolve requested badge icons
        run: node src/resolve_icons.mjs

      - name: Collect traffic history
        env:
          GH_TRAFFIC_TOKEN: ${{ secrets.GH_TRAFFIC_TOKEN }}
        run: python src/collect.py

      - name: Generate chart data
        run: python src/generate_chart_data.py

      - name: Render local SVG assets
        run: python src/render_assets.py

      - name: Commit updated metrics
        shell: bash
        run: |
          if [ -z "$(git status --porcelain -- data badges charts preview PORTFOLIO.md)" ]; then
            echo "No metric changes to commit."
            exit 0
          fi

          snapshot_dir="$(mktemp -d)"
          cp -a data "$snapshot_dir/data"
          cp -a badges "$snapshot_dir/badges"
          cp -a charts "$snapshot_dir/charts"
          cp -a preview "$snapshot_dir/preview"
          cp -a PORTFOLIO.md "$snapshot_dir/PORTFOLIO.md"

          git fetch origin main
          git reset --hard origin/main

          rm -rf data badges charts preview
          cp -a "$snapshot_dir/data" data
          cp -a "$snapshot_dir/badges" badges
          cp -a "$snapshot_dir/charts" charts
          cp -a "$snapshot_dir/preview" preview
          cp -a "$snapshot_dir/PORTFOLIO.md" PORTFOLIO.md

          if [ -z "$(git status --porcelain -- data badges charts preview PORTFOLIO.md)" ]; then
            echo "Remote already contains these metric changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data badges charts preview PORTFOLIO.md
          git commit -m "Update repository traffic metrics"
          git push origin HEAD:main
